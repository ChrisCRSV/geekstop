<!DOCTYPE html>
<html lang="es">
<head>
  <!-- =========================================================
       SECCIÓN 1: CONFIGURACIÓN TÉCNICA Y TÍTULO DE LA PÁGINA
       ========================================================= -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo Digital Gamer</title>

  <!-- =========================================================
       SECCIÓN 2: ESTILOS VISUALES (CSS)
       ========================================================= -->
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-hover: #273549;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green: #22c55e;
      --red: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --info-bg: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding-bottom: 50px;
    }

    /* Barra superior fija */
    header {
      background: #0b1120;
      border-bottom: 1px solid var(--border);
      padding: 18px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .logo span {
      color: var(--accent);
    }

    .search-box {
      flex: 1;
      min-width: 240px;
      max-width: 420px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    /* Fila de filtros */
    .filters {
      max-width: 1200px;
      margin: 20px auto 10px;
      padding: 0 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .filter-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.2s;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
    }

    /* Contenedor y cuadrícula */
    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 20px;
    }

    .section-title {
      font-size: 1.1rem;
      margin-bottom: 16px;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
      gap: 18px;
      align-items: start;
    }

    /* Tarjeta individual */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.2s, background 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      background: var(--card-hover);
    }

    .badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: var(--red);
      color: white;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .platform-tag {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
    }

    .card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      background: #0b1120;
    }

    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .card-category {
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 600;
      text-transform: uppercase;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      margin: 6px 0 12px;
      line-height: 1.3;
    }

    /* =========================================================
       NUEVOS ESTILOS: SELECTOR PRIMARIO / SECUNDARIO Y DESPLEGABLE
       ========================================================= */
    .edition-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }

    .edition-option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.45);
      cursor: pointer;
      transition: 0.2s;
    }

    .edition-option:hover {
      border-color: var(--accent);
    }

    .edition-option input[type="radio"] {
      margin-top: 4px;
      accent-color: var(--accent);
      cursor: pointer;
      width: 16px;
      height: 16px;
    }

    .edition-details {
      display: flex;
      flex-direction: column;
    }

    .edition-label {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 2px;
    }

    .edition-prices {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }

    .price-now {
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--green);
    }

    .price-now sup,
    .price-old sup {
      font-size: 0.65rem;
      font-weight: 600;
      margin-left: 2px;
    }

    .price-old {
      font-size: 0.9rem;
      color: var(--muted);
      text-decoration: line-through;
    }

    /* Botón "¿Cuál es la diferencia?" */
    .diff-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: #60a5fa;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 0;
      margin-bottom: 10px;
      text-align: left;
    }

    .diff-toggle:hover {
      text-decoration: underline;
    }

    .info-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #3b82f6;
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 800;
      font-style: italic;
    }

    /* Bloque desplegable con la explicación */
    .diff-box {
      display: none;
      background: var(--info-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.8rem;
      line-height: 1.45;
      color: #cbd5e1;
      margin-bottom: 12px;
    }

    .diff-box.open {
      display: block;
    }

    .diff-box p + p {
      margin-top: 6px;
    }

    /* Precio simple para tarjetas / suscripciones */
    .price-box {
      margin-bottom: 12px;
    }

    .old-price {
      font-size: 0.85rem;
      color: var(--muted);
      text-decoration: line-through;
      margin-right: 6px;
    }

    .price {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--green);
    }

    /* Botón de compra por WhatsApp */
    .buy-btn {
      display: block;
      text-align: center;
      background: var(--accent);
      color: white;
      text-decoration: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: 0.2s;
    }

    .buy-btn:hover {
      background: var(--accent-hover);
    }
  </style>
</head>

<body>

  <!-- =========================================================
       SECCIÓN 3: ENCABEZADO (LOGO Y BUSCADOR)
       ========================================================= -->
  <header>
    <div class="header-inner">
      <div class="logo" id="storeName">GEEK <span>STOP</span></div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar juego, combo o tarjeta..." />
      </div>
    </div>
  </header>

  <!-- =========================================================
       SECCIÓN 4: BARRA DE FILTROS
       ========================================================= -->
  <div class="filters" id="filterBar">
    <button class="filter-btn active" data-filter="TODOS">Todos</button>
    <button class="filter-btn" data-filter="PS5">Juegos PS5</button>
    <button class="filter-btn" data-filter="PS4">Juegos PS4</button>
    <button class="filter-btn" data-filter="COMBO">Combos</button>
    <button class="filter-btn" data-filter="TARJETAS">Tarjetas / Suscripciones</button>
  </div>

  <!-- =========================================================
       SECCIÓN 5: ZONA DEL CATÁLOGO
       ========================================================= -->
  <div class="container">
    <div class="section-title" id="resultCount">Cargando catálogo...</div>
    <div class="grid" id="productGrid"></div>
  </div>

  <script>
    /* =========================================================
       SECCIÓN 6: DATOS EDITABLES DE TU TIENDA Y PRODUCTOS
       ========================================================= */

    // 6A. Ajustes generales y texto único de "¿Cuál es la diferencia?"
    const CONFIG = {
      nombreTiendaParte1: "GEEK",
      nombreTiendaParte2: "STOP",
      moneda: "USD",
      whatsappNumero: "593999999999", // Tu número con código de país sin +

      // Texto único que se mostrará al abrir "¿Cuál es la diferencia?" en todos los juegos
      explicacionPrimarioSecundario: `
        <p><strong>Cuenta Primaria:</strong> Juegas directamente desde tu usuario personal de PlayStation, guardas tus trofeos y avances en tu cuenta y puedes jugar sin conexión a internet.</p>
        <p><strong>Cuenta Secundaria:</strong> Juegas ingresando al usuario entregado y requiere conexión a internet para verificar la licencia mientras juegas.</p>
      `
    };

    // 6B. Lista de productos
    // - Para JUEGOS (PS5, PS4, COMBO): usa esJuego: true y rellena primario y secundario.
    // - Para TARJETAS / SUSCRIPCIONES: usa esJuego: false y rellena precioAnterior y precioActual.
    const PRODUCTOS = [
      {
        titulo: "GTA 6 Standard Edition PS5",
        plataforma: "PS5",
        categoria: "Acción / Aventura",
        descuento: "-14%",
        esJuego: true,
        primario: { actual: "67.90", anterior: "79.00" },
        secundario: { actual: "56.60", anterior: "58.90" },
        imagen: "https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=600&q=80"
      },
      {
        titulo: "EA SPORTS FC 27 Standard Edition",
        plataforma: "PS5",
        categoria: "Deportes",
        descuento: "-46%",
        esJuego: true,
        primario: { actual: "28.50", anterior: "45.00" },
        secundario: { actual: "20.50", anterior: "38.00" },
        imagen: "https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=600&q=80"
      },
      {
        titulo: "God of War Ragnarök",
        plataforma: "PS4",
        categoria: "Aventura",
        descuento: "-65%",
        esJuego: true,
        primario: { actual: "18.90", anterior: "39.90" },
        secundario: { actual: "12.60", anterior: "36.00" },
        imagen: "https://images.unsplash.com/photo-1538481199705-c710c4e965fc?auto=format&fit=crop&w=600&q=80"
      },
      {
        titulo: "Combo Resident Evil 4, 5 y 6",
        plataforma: "COMBO",
        categoria: "Terror / Acción",
        descuento: "-60%",
        esJuego: true,
        primario: { actual: "24.90", anterior: "49.00" },
        secundario: { actual: "16.80", anterior: "42.00" },
        imagen: "https://images.unsplash.com/photo-1552820728-8b83bb6b773f?auto=format&fit=crop&w=600&q=80"
      },
      {
        titulo: "PlayStation Plus Extra 12 Meses",
        plataforma: "TARJETAS",
        categoria: "Suscripción",
        descuento: "-14%",
        esJuego: false,
        precioAnterior: "120.00",
        precioActual: "103.00",
        imagen: "https://images.unsplash.com/photo-1606144042614-b2417e99c4e3?auto=format&fit=crop&w=600&q=80"
      }
    ];

    /* =========================================================
       SECCIÓN 7: LÓGICA DEL FUNCIONAMIENTO (NO NECESITAS TOCARLA)
       ========================================================= */
    const storeNameEl = document.getElementById("storeName");
    storeNameEl.innerHTML = `${CONFIG.nombreTiendaParte1} <span>${CONFIG.nombreTiendaParte2}</span>`;

    let filtroActual = "TODOS";
    let textoBusqueda = "";

    const grid = document.getElementById("productGrid");
    const searchInput = document.getElementById("searchInput");
    const filterButtons = document.querySelectorAll(".filter-btn");
    const resultCount = document.getElementById("resultCount");

    function crearUrlWhatsapp(titulo, plataforma, modalidad, precio) {
      const detalleModalidad = modalidad ? ` - Edición: ${modalidad}` : "";
      const mensaje = encodeURIComponent(
        `Hola! Quiero comprar: ${titulo} (${plataforma})${detalleModalidad} - Precio: ${precio} ${CONFIG.moneda}`
      );
      return `https://wa.me/${CONFIG.whatsappNumero}?text=${mensaje}`;
    }

    function renderizarProductos() {
      const filtrados = PRODUCTOS.filter((producto) => {
        const coincidePlataforma =
          filtroActual === "TODOS" ||
          producto.plataforma.toUpperCase() === filtroActual;

        const coincideTexto =
          producto.titulo.toLowerCase().includes(textoBusqueda) ||
          producto.categoria.toLowerCase().includes(textoBusqueda) ||
          producto.plataforma.toLowerCase().includes(textoBusqueda);

        return coincidePlataforma && coincideTexto;
      });

      resultCount.textContent = `Mostrando ${filtrados.length} producto(s)`;

      if (filtrados.length === 0) {
        grid.innerHTML = `<p style="color: var(--muted);">No se encontraron productos con ese filtro o búsqueda.</p>`;
        return;
      }

      grid.innerHTML = filtrados
        .map((producto, idx) => {
          const badgeHtml = producto.descuento
            ? `<span class="badge">${producto.descuento}</span>`
            : "";

          // Bloque de precios si ES JUEGO (Primario y Secundario + desplegable)
          if (producto.esJuego) {
            const radioName = `edicion_${idx}`;
            const linkInicial = crearUrlWhatsapp(
              producto.titulo,
              producto.plataforma,
              "Primario",
              producto.primario.actual
            );

            return `
              <div class="card" data-titulo="${producto.titulo}" data-plataforma="${producto.plataforma}">
                ${badgeHtml}
                <span class="platform-tag">${producto.plataforma}</span>
                <img src="${producto.imagen}" alt="${producto.titulo}" loading="lazy" />
                <div class="card-body">
                  <div>
                    <div class="card-category">${producto.categoria}</div>
                    <div class="card-title">${producto.titulo}</div>

                    <div class="edition-options">
                      <label class="edition-option">
                        <input
                          type="radio"
                          name="${radioName}"
                          value="Primario"
                          data-precio="${producto.primario.actual}"
                          checked
                        />
                        <div class="edition-details">
                          <span class="edition-label">Primario</span>
                          <div class="edition-prices">
                            <span class="price-now">${producto.primario.actual}<sup>${CONFIG.moneda}</sup></span>
                            ${producto.primario.anterior ? `<span class="price-old">${producto.primario.anterior}<sup>${CONFIG.moneda}</sup></span>` : ""}
                          </div>
                        </div>
                      </label>

                      <label class="edition-option">
                        <input
                          type="radio"
                          name="${radioName}"
                          value="Secundario"
                          data-precio="${producto.secundario.actual}"
                        />
                        <div class="edition-details">
                          <span class="edition-label">Secundario</span>
                          <div class="edition-prices">
                            <span class="price-now">${producto.secundario.actual}<sup>${CONFIG.moneda}</sup></span>
                            ${producto.secundario.anterior ? `<span class="price-old">${producto.secundario.anterior}<sup>${CONFIG.moneda}</sup></span>` : ""}
                          </div>
                        </div>
                      </label>
                    </div>

                    <button type="button" class="diff-toggle">
                      <span class="info-icon">i</span> ¿Cuál es la diferencia? ▾
                    </button>
                    <div class="diff-box">
                      ${CONFIG.explicacionPrimarioSecundario}
                    </div>
                  </div>

                  <a class="buy-btn" href="${linkInicial}" target="_blank" rel="noopener noreferrer">
                    Comprar por WhatsApp
                  </a>
                </div>
              </div>
            `;
          }

          // Bloque de precio simple si NO es juego (Tarjetas / Suscripciones)
          const linkSimple = crearUrlWhatsapp(
            producto.titulo,
            producto.plataforma,
            "",
            producto.precioActual
          );

          const oldPriceHtml = producto.precioAnterior
            ? `<span class="old-price">${producto.precioAnterior} ${CONFIG.moneda}</span>`
            : "";

          return `
            <div class="card">
              ${badgeHtml}
              <span class="platform-tag">${producto.plataforma}</span>
              <img src="${producto.imagen}" alt="${producto.titulo}" loading="lazy" />
              <div class="card-body">
                <div>
                  <div class="card-category">${producto.categoria}</div>
                  <div class="card-title">${producto.titulo}</div>
                </div>
                <div>
                  <div class="price-box">
                    ${oldPriceHtml}
                    <span class="price">${producto.precioActual} ${CONFIG.moneda}</span>
                  </div>
                  <a class="buy-btn" href="${linkSimple}" target="_blank" rel="noopener noreferrer">
                    Comprar por WhatsApp
                  </a>
                </div>
              </div>
            </div>
          `;
        })
        .join("");

      // Conecta los eventos de cada tarjeta recién dibujada
      activarEventosTarjetas();
    }

    function activarEventosTarjetas() {
      // 1. Al cambiar entre Primario y Secundario, actualiza el enlace de WhatsApp
      document.querySelectorAll('.card input[type="radio"]').forEach((radio) => {
        radio.addEventListener("change", (e) => {
          const card = e.target.closest(".card");
          const titulo = card.dataset.titulo;
          const plataforma = card.dataset.plataforma;
          const modalidad = e.target.value;
          const precio = e.target.dataset.precio;

          const buyBtn = card.querySelector(".buy-btn");
          buyBtn.href = crearUrlWhatsapp(titulo, plataforma, modalidad, precio);
        });
      });

      // 2. Al hacer clic en "¿Cuál es la diferencia?", abre o cierra la explicación
      document.querySelectorAll(".diff-toggle").forEach((btn) => {
        btn.addEventListener("click", () => {
          const box = btn.nextElementSibling;
          box.classList.toggle("open");
        });
      });
    }

    filterButtons.forEach((boton) => {
      boton.addEventListener("click", () => {
        filterButtons.forEach((b) => b.classList.remove("active"));
        boton.classList.add("active");
        filtroActual = boton.dataset.filter;
        renderizarProductos();
      });
    });

    searchInput.addEventListener("input", (evento) => {
      textoBusqueda = evento.target.value.toLowerCase().trim();
      renderizarProductos();
    });

    renderizarProductos();
  </script>
</body>
</html>
