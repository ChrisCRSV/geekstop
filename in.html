<!DOCTYPE html>
<html lang="es">
<head>
  <!-- =========================================================
       SECCIÓN 1: CONFIGURACIÓN TÉCNICA Y TÍTULO DE LA PÁGINA
       Aquí defines el título que aparece en la pestaña del navegador.
       ========================================================= -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo Digital Gamer</title>
  
  <!-- =========================================================
       SECCIÓN 2: ESTILOS VISUALES (CSS)
       Aquí controlas colores, tamaños, bordes y distribución.
       Si quieres cambiar colores o el estilo de las tarjetas, se edita aquí.
       ========================================================= -->
  <style>
    /* Variables de color principales de la tienda */
    :root {
      --bg: #0f172a;          /* Color de fondo general */
      --card: #1e293b;        /* Color de fondo de cada tarjeta de producto */
      --card-hover: #273549;  /* Color de la tarjeta al pasar el mouse */
      --accent: #3b82f6;      /* Color principal (botones y detalles) */
      --accent-hover: #2563eb;/* Color del botón al pasar el mouse */
      --green: #22c55e;       /* Color del precio actual */
      --red: #ef4444;         /* Color de la etiqueta de descuento */
      --text: #f8fafc;        /* Color del texto principal */
      --muted: #94a3b8;       /* Color del texto secundario / precio tachado */
      --border: #334155;      /* Color de bordes sutiles */
    }

    /* Reseteo básico para que todos los navegadores midan igual */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding-bottom: 50px;
    }

    /* Barra superior fija (Header) */
    header {
      background: #0b1120;
      border-bottom: 1px solid var(--border);
      padding: 18px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .logo span {
      color: var(--accent);
    }

    /* Caja de búsqueda */
    .search-box {
      flex: 1;
      min-width: 240px;
      max-width: 420px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    /* Fila de botones de filtro */
    .filters {
      max-width: 1200px;
      margin: 20px auto 10px;
      padding: 0 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .filter-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.2s;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
    }

    /* Contenedor principal de la cuadrícula de productos */
    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 20px;
    }

    .section-title {
      font-size: 1.1rem;
      margin-bottom: 16px;
      color: var(--muted);
    }

    /* Cuadrícula adaptable: ajusta columnas según el ancho de pantalla */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
    }

    /* Tarjeta individual de cada producto */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.2s, background 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      background: var(--card-hover);
    }

    /* Etiqueta roja de descuento (arriba a la izquierda) */
    .badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: var(--red);
      color: white;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
    }

    /* Etiqueta de plataforma (arriba a la derecha) */
    .platform-tag {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
    }

    /* Imagen de portada del producto */
    .card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      background: #0b1120;
    }

    /* Contenido interno de la tarjeta */
    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .card-category {
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 600;
      text-transform: uppercase;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      margin: 6px 0 10px;
      line-height: 1.3;
    }

    .price-box {
      margin-bottom: 12px;
    }

    .old-price {
      font-size: 0.82rem;
      color: var(--muted);
      text-decoration: line-through;
      margin-right: 6px;
    }

    .price {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--green);
    }

    /* Botón de compra */
    .buy-btn {
      display: block;
      text-align: center;
      background: var(--accent);
      color: white;
      text-decoration: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: 0.2s;
    }

    .buy-btn:hover {
      background: var(--accent-hover);
    }
  </style>
</head>

<body>

  <!-- =========================================================
       SECCIÓN 3: ENCABEZADO (LOGO Y BUSCADOR)
       Aquí está el título visible de la tienda y la caja de búsqueda.
       ========================================================= -->
  <header>
    <div class="header-inner">
      <div class="logo" id="storeName">GAMER <span>STORE</span></div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar juego, combo o tarjeta..." />
      </div>
    </div>
  </header>

  <!-- =========================================================
       SECCIÓN 4: BARRA DE FILTROS
       Cada botón filtra según su atributo data-filter.
       Si agregas una categoría nueva, aquí sumas su botón.
       ========================================================= -->
  <div class="filters" id="filterBar">
    <button class="filter-btn active" data-filter="TODOS">Todos</button>
    <button class="filter-btn" data-filter="PS5">Juegos PS5</button>
    <button class="filter-btn" data-filter="PS4">Juegos PS4</button>
    <button class="filter-btn" data-filter="COMBO">Combos</button>
    <button class="filter-btn" data-filter="TARJETAS">Tarjetas / Suscripciones</button>
  </div>

  <!-- =========================================================
       SECCIÓN 5: ZONA DEL CATÁLOGO
       El contador y la cuadrícula se llenan automáticamente desde JavaScript.
       ========================================================= -->
  <div class="container">
    <div class="section-title" id="resultCount">Cargando catálogo...</div>
    <div class="grid" id="productGrid"></div>
  </div>

  <script>
    /* =========================================================
       SECCIÓN 6: DATOS EDITABLES DE TU TIENDA Y PRODUCTOS
       Esta es la zona que más vas a modificar en el día a día.
       ========================================================= */

    // 6A. Ajustes generales de tu tienda
    const CONFIG = {
      nombreTiendaParte1: "GAMER",          // Primera palabra del logo
      nombreTiendaParte2: "STORE",          // Segunda palabra (resaltada en azul)
      moneda: "USD",                        // Moneda mostrada junto al precio
      whatsappNumero: "593999999999"        // Número de WhatsApp con código de país (sin + ni espacios)
    };

    // 6B. Lista de productos (copia y pega un objeto {...} para agregar uno nuevo)
    const PRODUCTOS = [
      {
        titulo: "GTA 6 Standard Edition PS5",
        plataforma: "PS5", // Debe coincidir con los filtros: PS5, PS4, COMBO o TARJETAS
        categoria: "Acción / Aventura",
        descuento: "-14%", // Déjalo vacío "" si no quieres mostrar etiqueta roja
        precioAnterior: "65.90", // Déjalo vacío "" si no quieres precio tachado
        precioActual: "56.60",
        imagen: "https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=600&q=80"
      },
      {
        titulo: "EA SPORTS FC 27 Standard Edition",
        plataforma: "PS5",
        categoria: "Deportes",
        descuento: "-46%",
        precioAnterior: "38.00",
        precioActual: "20.50",
        imagen: "https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=600&q=80"
      },
      {
        titulo: "God of War Ragnarök",
        plataforma: "PS4",
        categoria: "Aventura",
        descuento: "-65%",
        precioAnterior: "36.00",
        precioActual: "12.60",
        imagen: "https://images.unsplash.com/photo-1538481199705-c710c4e965fc?auto=format&fit=crop&w=600&q=80"
      },
      {
        titulo: "Combo Resident Evil 4, 5 y 6",
        plataforma: "COMBO",
        categoria: "Terror / Acción",
        descuento: "-60%",
        precioAnterior: "42.00",
        precioActual: "16.80",
        imagen: "https://images.unsplash.com/photo-1552820728-8b83bb6b773f?auto=format&fit=crop&w=600&q=80"
      },
      {
        titulo: "PlayStation Plus Extra 12 Meses",
        plataforma: "TARJETAS",
        categoria: "Suscripción",
        descuento: "-14%",
        precioAnterior: "120.00",
        precioActual: "103.00",
        imagen: "https://images.unsplash.com/photo-1606144042614-b2417e99c4e3?auto=format&fit=crop&w=600&q=80"
      }
    ];

    /* =========================================================
       SECCIÓN 7: LÓGICA DEL FUNCIONAMIENTO (NO TOCAR AL INICIO)
       Aquí se aplica el nombre de la tienda, se filtran productos,
       se lee el buscador y se generan las tarjetas en pantalla.
       ========================================================= */

    // 7A. Aplica el nombre configurado en CONFIG al logo superior
    const storeNameEl = document.getElementById("storeName");
    storeNameEl.innerHTML = `${CONFIG.nombreTiendaParte1} <span>${CONFIG.nombreTiendaParte2}</span>`;

    // 7B. Estado actual de filtros y búsqueda
    let filtroActual = "TODOS";
    let textoBusqueda = "";

    // 7C. Referencias a elementos del HTML
    const grid = document.getElementById("productGrid");
    const searchInput = document.getElementById("searchInput");
    const filterButtons = document.querySelectorAll(".filter-btn");
    const resultCount = document.getElementById("resultCount");

    // 7D. Función principal: filtra y dibuja las tarjetas en pantalla
    function renderizarProductos() {
      const filtrados = PRODUCTOS.filter((producto) => {
        // Comprueba si coincide con el botón de plataforma activo
        const coincidePlataforma =
          filtroActual === "TODOS" ||
          producto.plataforma.toUpperCase() === filtroActual;

        // Comprueba si el texto escrito aparece en título, categoría o plataforma
        const coincideTexto =
          producto.titulo.toLowerCase().includes(textoBusqueda) ||
          producto.categoria.toLowerCase().includes(textoBusqueda) ||
          producto.plataforma.toLowerCase().includes(textoBusqueda);

        return coincidePlataforma && coincideTexto;
      });

      // Actualiza el contador de resultados
      resultCount.textContent = `Mostrando ${filtrados.length} producto(s)`;

      // Si no hay coincidencias, muestra un mensaje amigable
      if (filtrados.length === 0) {
        grid.innerHTML = `<p style="color: var(--muted);">No se encontraron productos con ese filtro o búsqueda.</p>`;
        return;
      }

      // Construye el HTML de cada tarjeta
      grid.innerHTML = filtrados
        .map((producto) => {
          // Prepara el mensaje automático de WhatsApp con los datos del producto
          const mensaje = encodeURIComponent(
            `Hola! Quiero consultar por: ${producto.titulo} (${producto.plataforma}) - Precio: ${producto.precioActual} ${CONFIG.moneda}`
          );
          const linkWhatsapp = `https://wa.me/${CONFIG.whatsappNumero}?text=${mensaje}`;

          // Solo muestra la etiqueta roja si existe un descuento
          const badgeHtml = producto.descuento
            ? `<span class="badge">${producto.descuento}</span>`
            : "";

          // Solo muestra el precio tachado si existe precioAnterior
          const oldPriceHtml = producto.precioAnterior
            ? `<span class="old-price">${producto.precioAnterior} ${CONFIG.moneda}</span>`
            : "";

          return `
            <div class="card">
              ${badgeHtml}
              <span class="platform-tag">${producto.plataforma}</span>
              <img src="${producto.imagen}" alt="${producto.titulo}" loading="lazy" />
              <div class="card-body">
                <div>
                  <div class="card-category">${producto.categoria}</div>
                  <div class="card-title">${producto.titulo}</div>
                </div>
                <div>
                  <div class="price-box">
                    ${oldPriceHtml}
                    <span class="price">Desde ${producto.precioActual} ${CONFIG.moneda}</span>
                  </div>
                  <a class="buy-btn" href="${linkWhatsapp}" target="_blank" rel="noopener noreferrer">
                    Comprar por WhatsApp
                  </a>
                </div>
              </div>
            </div>
          `;
        })
        .join("");
    }

    // 7E. Escucha los clics en los botones de filtro
    filterButtons.forEach((boton) => {
      boton.addEventListener("click", () => {
        filterButtons.forEach((b) => b.classList.remove("active"));
        boton.classList.add("active");
        filtroActual = boton.dataset.filter;
        renderizarProductos();
      });
    });

    // 7F. Escucha lo que el usuario escribe en el buscador
    searchInput.addEventListener("input", (evento) => {
      textoBusqueda = evento.target.value.toLowerCase().trim();
      renderizarProductos();
    });

    // 7G. Primera ejecución al cargar la página
    renderizarProductos();
  </script>
</body>
</html>
